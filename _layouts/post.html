---
layout: default
---
<article class="blog-article">
  <header class="blog-article-header">
    <p class="blog-eyebrow">Writing / {{ page.date | date: "%Y" }}</p>
    <h1 class="blog-article-title">{{ page.title }}</h1>
    <div class="blog-article-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %d, %Y" }}</time>
      {% if page.tags and page.tags.size > 0 %}
        <span aria-hidden="true"> · </span>
        <span>{{ page.tags | join: " / " }}</span>
      {% endif %}
    </div>
  </header>

  <div class="blog-article-body">
    {{ content }}
  </div>

  <footer class="blog-nav blog-article-footer">
    <a class="blog-back" href="{{ '/blog/' | relative_url }}">← All writing</a>
    <a class="blog-back" href="{{ '/' | relative_url }}">Home</a>
  </footer>
</article>
