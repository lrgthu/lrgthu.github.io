  frontispiece:
    plate: "Plate II"
    src: /assets/blog/plate-02-when-the-world-pushes-back.webp
    alt: "Copperplate engraving inspired by Held and Hein's kitten carousel crowned by a centrifugal governor, contrasting an actively walking cat in a closed sensorimotor loop against a passive cat suspended in a gondola."
    caption: "After Held & Hein (1963) and Wiener (1948): matched visual stripes under a shared governor, contrasting closed-loop reafference on the left with open-loop passive transport on the right."

