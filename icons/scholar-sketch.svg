  <path d="M1.44 21.84 C8.16 22.56, 15.60 21.12, 22.80 21.84" fill="none" stroke="#6f6048" stroke-width="0.105" stroke-linecap="round" opacity="0.38" vector-effect="non-scaling-stroke"/>
</svg>
