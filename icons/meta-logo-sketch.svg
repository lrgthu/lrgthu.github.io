<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 11" role="img">
  <title>Meta Logo sketch</title>
  <defs>
    <filter id="pencilSketch" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.28 0.55 0.17 0 0  0.28 0.55 0.17 0 0  0.28 0.55 0.17 0 0  0 0 0 1 0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.06 0.72"/>
        <feFuncG type="table" tableValues="0.05 0.64"/>
        <feFuncB type="table" tableValues="0.04 0.52"/>
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.12" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="1.250" y="1.250" width="47.500" height="8.500" fill="#fff5df" stroke="#6f6048" stroke-width="0.500" stroke-dasharray="0.90 0.65" vector-effect="non-scaling-stroke"/>
  <image href="meta-logo.svg" x="0" y="0" width="50" height="11" preserveAspectRatio="xMidYMid meet" filter="url(#pencilSketch)" opacity="0.9" style="mix-blend-mode:multiply"/>
  <path d="M2.00 1.21 C12.50 0.66, 29.00 1.54, 48.00 0.99" fill="none" stroke="#6f6048" stroke-width="0.210" stroke-linecap="round" opacity="0.45" vector-effect="non-scaling-stroke"/>
  <path d="M3.00 10.01 C17.00 10.34, 32.50 9.68, 47.50 10.01" fill="none" stroke="#6f6048" stroke-width="0.210" stroke-linecap="round" opacity="0.38" vector-effect="non-scaling-stroke"/>
</svg>
